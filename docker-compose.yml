version: '3.8'

services:
  # Base de Datos Relacional para Obras, Alumnos y Docentes
  postgres-db:
    image: postgres:15
    container_name: muro_escolar_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: muro_escolar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Base de Datos Documental para Feedback y Comentarios
  mongodb:
    image: mongo:6.0
    container_name: muro_escolar_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  postgres_data:
  mongo_data: